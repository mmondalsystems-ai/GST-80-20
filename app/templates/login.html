<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · {{ portal }}</title><link rel="stylesheet" href="/static/app.css">
</head><body>
<div class="login"><div class="card">
  <div class="eyebrow">{{ org }}</div>
  <h1>{{ portal }}</h1>
  <p class="sub" style="margin-bottom:20px">Sign in to continue.</p>
  {% if error %}<div class="callout err" style="margin-bottom:16px">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token_value" value="{{ csrf_token(request) }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field"><span>Email</span>
      <input type="email" name="email" required autofocus autocomplete="username"></label>
    <label class="field"><span>Password</span>
      <input type="password" name="password" required autocomplete="current-password"></label>
    <button class="primary" type="submit" style="width:100%">Sign in</button>
  </form>
</div></div>
</body></html>
